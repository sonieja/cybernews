{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-box">
    <h1>Create an account</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" value="{{ username or '' }}" required
               minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]+" autocomplete="username">
        <label for="password">Password (at least 8 characters)</label>
        <input type="password" name="password" id="password" required minlength="8" autocomplete="new-password">
        <label for="confirm">Repeat password</label>
        <input type="password" name="confirm" id="confirm" required minlength="8" autocomplete="new-password">
        <button type="submit" class="btn">Register</button>
    </form>
    <p class="muted">New accounts are normal users. They can read and bookmark news, but not edit it.</p>
</div>
{% endblock %}
