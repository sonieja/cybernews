{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="form-box">
    <h1>Contact us</h1>
    <p>Report a security problem with the site or suggest a news source.</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form action="{{ url_for('submit_message') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" required maxlength="100">
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required maxlength="200">
        <label for="message">Message:</label>
        <textarea name="message" id="message" rows="5" required maxlength="2000"></textarea>
        <button type="submit" class="btn">Send</button>
    </form>
</div>
{% endblock %}
