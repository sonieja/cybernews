{% extends "base.html" %}
{% block title %}{{ 'Add article' if mode == 'add' else 'Edit article' }}{% endblock %}
{% block content %}
<div class="form-box wide">
    <h1>{{ 'Add a new article' if mode == 'add' else 'Edit article' }}</h1>
    <form method="POST" action="{{ url_for('add_article') if mode == 'add' else url_for('edit_article', article_id=article.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="title">Title</label>
        <input type="text" name="title" id="title" value="{{ article.title or '' }}" required maxlength="200">
        <label for="summary">Short summary</label>
        <textarea name="summary" id="summary" rows="3" required maxlength="500">{{ article.summary or '' }}</textarea>
        <label for="content">Full text</label>
        <textarea name="content" id="content" rows="7" maxlength="10000">{{ article.content or '' }}</textarea>
        <div class="two-cols">
            <div>
                <label for="source">Source name</label>
                <input type="text" name="source" id="source" value="{{ article.source or '' }}" required placeholder="e.g. SecurityWeek">
            </div>
            <div>
                <label for="source_url">Source link</label>
                <input type="url" name="source_url" id="source_url" value="{{ article.source_url or '' }}" required>
            </div>
            <div>
                <label for="category">Category</label>
                <select name="category" id="category" required>
                    {% for c in categories %}<option value="{{ c }}" {% if c == article.category %}selected{% endif %}>{{ c }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label for="published_date">Published date</label>
                <input type="date" name="published_date" id="published_date" value="{{ article.published_date or '' }}" required>
            </div>
        </div>
        <label class="check"><input type="checkbox" name="is_featured" value="1" {% if article.is_featured %}checked{% endif %}> Show in "Featured stories"</label>
        <button type="submit" class="btn">{{ 'Add article' if mode == 'add' else 'Save changes' }}</button>
    </form>
</div>
{% endblock %}
